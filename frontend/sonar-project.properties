sonar.projectKey=apextosos-frontend
sonar.projectName=Apextosos - Frontend
sonar.projectVersion=1.0

sonar.sources=src

sonar.exclusions=**/node_modules/**,**/.next/**,**/out/**,**/dist/**,**/build/**,**/public/**,**/*.spec.ts,**/*.test.ts,**/*.spec.tsx,**/*.test.tsx,**/*.d.ts

sonar.tests=src
